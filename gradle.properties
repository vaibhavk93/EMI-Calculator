org.gradle.jvmargs=-Xmx3g -XX:-UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=false
kotlin.code.style=official

# The Kotlin compile daemon fails GC auto-selection in constrained containers, so run
# the compiler inside the Gradle JVM instead. Remove this when building on a workstation.
kotlin.compiler.execution.strategy=in-process
